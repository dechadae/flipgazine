<style>
  /* overflow lives on #boot, not on html/body. It only ever existed to stop the
     splash scrolling, and on the root it is one bad paint away from silently
     locking a written page that has nothing to do with the shell. */
  html,body{margin:0;height:100%;background:#0D1110;color:#F4F1EB;
    font-family:'Poppins',system-ui,-apple-system,sans-serif;font-weight:300;}
  /* The boot screen is the seam between pages: document.write() replaces this
     whole document, so nothing can animate across it. Rather than transition,
     it wears the destination's header — same responsive geometry, same glass,
     same hairline, brand in the same place. The bar appears not to move while
     the body arrives underneath, which is the effect a transition would have bought.
     A centred spinner did the opposite: it drew the eye to the middle of an
     empty screen, then vanished. */
  #boot{position:fixed;inset:0;overflow:hidden;}
  #bootbar{position:absolute;top:0;left:0;right:0;
    background:rgba(21,25,24,.55);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
    border-bottom:1px solid rgba(244,241,235,.14);}
  .bwrap{width:auto;max-width:1240px;margin:0 auto;padding:0 clamp(20px,4vw,48px);}
  .brow{display:flex;align-items:center;justify-content:space-between;gap:18px;
    min-height:30px;padding:12px 0;}
  .bbrand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;
    letter-spacing:.01em;color:#F4F1EB;}
  .fmark{width:28px;height:auto;color:#00F0D1;}
  @media (min-width:640px){.fmark{width:32px}.bbrand{font-size:16px}}
  @media (min-width:1024px){.brow{padding:15px 0}}
  @media (min-width:1440px){.brow{padding:18px 0}.bbrand{font-size:17px;gap:12px}.fmark{width:36px}}
  /* Held back deliberately. On a warm cache the page paints in a few
     frames, and a progress hint that flashes for 40ms reads as a glitch.
     It only appears once the wait is long enough to be worth explaining. */
  #bootline{position:absolute;top:55px;left:0;right:0;height:1px;overflow:hidden;
    opacity:0;transition:opacity .35s ease;}
  /* No bar on a book, so the hint has nothing to hang beneath. */
  #boot.nobar #bootline{top:0;}
  #boot.slow #bootline{opacity:1;}
  #bootline i{display:block;height:100%;width:34%;background:#00F0D1;
    animation:bootslide 1.15s cubic-bezier(.4,0,.2,1) infinite;}
  @keyframes bootslide{0%{transform:translateX(-110%)}100%{transform:translateX(400%)}}
  .err{max-width:320px;text-align:center;padding:0 24px;line-height:1.7;font-size:14px;color:#c9c6c0;}
  .err a{color:#00F0D1;text-decoration:none;font-weight:600;}

       first paint -- persistent-stage migration, Phase 1. A header edit no
       longer has to land in the very first paint to be correct: the same
       repaint-if-different check below still fires once the live fetch
       resolves, same as it already does for content, so the edit still lands
       on this load, just via a same-load correction instead of blocking the
       first frame on it. */
    if(cachedHeader){
      setTimeout(function(){ paint(compose(cached,cachedHeader)); }, 0);
    }
    headerFresh.then(function(fragment){
      if(authReturn) return;
      if(cachedHeader && fragment===cachedHeader) return;
      painted=false;
      setTimeout(function(){ paint(compose(cached,fragment)); }, 0);
    }).catch(function(){});
    fresh.then(function(html){
      /* This used to only refresh the cache, so a database edit did not surface
         until the NEXT load — the single most common source of "your change
         didn't work". Repaint when the content actually changed: still instant
         from cache in the common case, but an edit lands on this load. If the
         fetch wins the race, painted is still false and the fresh copy paints
         first, making the queued cache paint a no-op. */
      headerFresh.then(function(fragment){
        if(authReturn) return;
        if(html===cached && (!cachedHeader || fragment===cachedHeader)) return;
        painted=false;
        paint(compose(html,fragment));
      });
    }).catch(function(){});
  }else{
    /* Same reasoning on a cold load: the network is the wait, and adding to it
       does not make anything smoother. */
    Promise.all([fresh,headerFresh])
      .then(function(all){ paint(compose(all[0],all[1])); }).catch(fail);
  }
})();
</script>
</body>
</html>
