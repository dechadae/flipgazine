  /* overflow lives on #boot, not on html/body. It only ever existed to stop the
     splash scrolling, and on the root it is one bad paint away from silently
     locking a written page that has nothing to do with the shell. */
  html,body{margin:0;height:100%;background:#0D1110;color:#F4F1EB;
    font-family:'Poppins',system-ui,-apple-system,sans-serif;font-weight:300;}

     whole document, so nothing can animate across it. Rather than transition,
     it wears the destination's header — same 64px, same glass, same hairline,
     brand in the same place. The bar appears not to move while the body
     arrives underneath, which is the effect a transition would have bought.
     A centred spinner did the opposite: it drew the eye to the middle of an
     empty screen, then vanished. */
  #boot{position:fixed;inset:0;overflow:hidden;}
  #bootbar{position:absolute;top:0;left:0;right:0;height:64px;
    background:rgba(21,25,24,.55);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);

    display:flex;align-items:center;}

  .bbrand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;
    letter-spacing:.01em;color:#F4F1EB;}
  .fmark{width:28px;height:auto;color:#00F0D1;}
  /* Held back deliberately. On a warm cache the page paints in a few
     frames, and a progress hint that flashes for 40ms reads as a glitch.
     It only appears once the wait is long enough to be worth explaining. */
  #bootline{position:absolute;top:64px;left:0;right:0;height:1px;overflow:hidden;
    opacity:0;transition:opacity .35s ease;}
  /* No bar on a book, so the hint has nothing to hang beneath. */
  #boot.nobar #bootline{top:0;}
  #boot.slow #bootline{opacity:1;}
  #bootline i{display:block;height:100%;width:34%;background:#00F0D1;
    animation:bootslide 1.15s cubic-bezier(.4,0,.2,1) infinite;}
  @keyframes bootslide{0%{transform:translateX(-110%)}100%{transform:translateX(400%)}}
