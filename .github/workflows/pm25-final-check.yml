name: PM25 final live check

on:
  push:
    branches:
      - pm25-final-check
    paths:
      - ".github/workflows/pm25-final-check.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pm25-final-check
          fetch-depth: 1

      - name: Verify public shell and assets
        shell: bash
        run: |
          set -euo pipefail
          cb="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          code="$(curl --max-time 20 -sS -L -o /tmp/index.html -w '%{http_code}' -H 'Cache-Control: no-cache' "https://flipgazine.pages.dev/index.html?cb=$cb")"
          test "$code" = 200
          grep -Fq 'fg-boot-dark' /tmp/index.html
          grep -Fq 'fg-boot-quiet' /tmp/index.html
          grep -Fq "var isQuiet=path==='/sindhornmidtown/pm25.html';" /tmp/index.html
          grep -Fq 'The live air-quality report' /tmp/index.html
          grep -Fq 'ไม่สามารถโหลดรายงานคุณภาพอากาศได้' /tmp/index.html

          urls=(
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/vignette/v1/fonts/vignette-sans-light.woff'
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/vignette/v1/fonts/vignette-sans-regular.woff'
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/vignette/v1/fonts/vignette-sans-semibold.woff'
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/vignette/v1/fonts/ibm-plex-sans-thai-light.woff2'
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/vignette/v1/fonts/ibm-plex-sans-thai-regular.woff2'
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/vignette/v1/fonts/ibm-plex-sans-thai-semibold.woff2'
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/sindhorn-midtown/v1/sindhorn-midtown-vignette-black.png'
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/sindhorn-midtown/v1/sindhorn-midtown-vignette-white.png'
          )
          for u in "${urls[@]}"; do
            code="$(curl --max-time 20 -sS -L -o /dev/null -w '%{http_code}' "$u")"
            test "$code" = 200 || { echo "resource failed: $code"; exit 1; }
          done

      - name: Install Playwright
        run: |
          npm --silent init -y >/dev/null 2>&1
          npm --silent install playwright@1.55.0
          npx playwright install chromium

      - name: Verify live page in Chromium
        run: |
          cat > /tmp/pm25-check.mjs <<'JS'
          import { chromium } from 'playwright';
          const URL='https://flipgazine.pages.dev/sindhornmidtown/pm25.html';
          const BLACK='https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/sindhorn-midtown/v1/sindhorn-midtown-vignette-black.png';
          const WHITE='https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/sindhorn-midtown/v1/sindhorn-midtown-vignette-white.png';
          const AIR='https://stations.airbkk.com/api/web/data';
          const browser=await chromium.launch({headless:true});
          const report=[];

          async function check(width,height,scheme){
            const context=await browser.newContext({viewport:{width,height},colorScheme:scheme});
            const page=await context.newPage();
            const consoleErrors=[]; const pageErrors=[]; const resourceStatus=new Map();
            page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('response',r=>{
              const u=r.url();
              if(u===BLACK||u===WHITE||u===AIR||u.includes('/brand/vignette/v1/fonts/')) resourceStatus.set(u,r.status());
            });
            await page.addInitScript(() => {
              window.__paintSamples=[];
              const start=performance.now();
              const timer=setInterval(()=>{
                const root=document.documentElement;
                const body=document.body;
                if(root){
                  const rs=getComputedStyle(root);
                  window.__paintSamples.push({t:performance.now()-start,root:rs.backgroundColor,classes:root.className,body:body?getComputedStyle(body).backgroundColor:null});
                }
                if(performance.now()-start>2500) clearInterval(timer);
              },10);
            });
            const target=URL+`?cb=${Date.now()}-${width}-${scheme}`;
            const nav=await page.goto(target,{waitUntil:'domcontentloaded',timeout:30000});
            if(!nav || nav.status()!==200) throw new Error(`navigation ${nav?.status()} at ${width}/${scheme}`);
            await page.locator('#report').waitFor({state:'visible',timeout:20000});
            await page.waitForFunction(()=>document.querySelector('#report')?.getAttribute('aria-busy')==='false',{timeout:20000});
            await page.waitForTimeout(800);

            const data=await page.evaluate(()=>{
              const hotel=[...document.querySelectorAll('.hotel-name')].map(el=>{
                const r=document.createRange(); r.selectNodeContents(el);
                const rects=[...r.getClientRects()];
                return {text:el.textContent,lines:[...new Set(rects.map(x=>Math.round(x.top)))]};
              });
              const scale=document.querySelector('.scale-labels');
              const first=scale?.firstElementChild;
              const samples=(window.__paintSamples||[]).slice();
              return {
                title:document.title,
                theme:document.documentElement.getAttribute('data-theme'),
                hotel,
                scaleColumns:scale?getComputedStyle(scale).gridTemplateColumns:'',
                scaleFirstDisplay:first?getComputedStyle(first).display:'',
                scaleFirstColumns:first?getComputedStyle(first).gridTemplateColumns:'',
                pm:document.querySelector('#pmValue')?.textContent.trim(),
                aqi:document.querySelector('#aqiValue')?.textContent.trim(),
                connection:document.querySelector('#connection')?.getAttribute('data-state'),
                hasManifest:!!document.querySelector('link[rel="manifest"]'),
                hasHeader:!!document.querySelector('header'),
                visibleFlipgazine:(document.body?.innerText||'').toLowerCase().includes('flipgazine'),
                vignetteFont:getComputedStyle(document.querySelector('h1')).fontFamily,
                thaiFont:getComputedStyle(document.querySelector('h1 [lang="th"]')).fontFamily,
                vignetteLoaded:document.fonts.check('16px "Vignette Sans"'),
                thaiLoaded:document.fonts.check('16px "IBM Plex Sans Thai"'),
                samples
              };
            });

            if(data.theme!==scheme) throw new Error(`device theme mismatch ${width}/${scheme}: ${data.theme}`);
            if(data.hotel.length!==2 || data.hotel.some(x=>x.text!=='สินธร มิดทาวน์'||x.lines.length!==1)) throw new Error(`hotel-name wrap ${width}/${scheme}: ${JSON.stringify(data.hotel)}`);
            if(width<=520){
              if(data.scaleFirstDisplay!=='grid') throw new Error(`mobile scale is not rows ${width}/${scheme}`);
              if(!data.scaleFirstColumns.startsWith('64px ')) throw new Error(`mobile scale columns unexpected ${data.scaleFirstColumns}`);
            } else if(data.scaleColumns.trim().split(/\s+/).length!==5) throw new Error(`desktop scale not five columns: ${data.scaleColumns}`);
            if(!data.pm || data.pm==='—' || !data.aqi || data.aqi==='—') throw new Error(`missing live values ${width}/${scheme}: ${data.pm}/${data.aqi}`);
            if(!['live','delayed'].includes(data.connection)) throw new Error(`online connection state ${data.connection}`);
            if(data.hasManifest||data.hasHeader||data.visibleFlipgazine) throw new Error(`standalone invariant failed ${JSON.stringify({manifest:data.hasManifest,header:data.hasHeader,visibleFlipgazine:data.visibleFlipgazine})}`);
            if(!data.vignetteLoaded||!data.thaiLoaded) throw new Error(`font load failed ${width}/${scheme}`);
            const darkFlash=data.samples.some(s=>s.root==='rgb(13, 17, 16)'||s.body==='rgb(13, 17, 16)');
            if(darkFlash) throw new Error(`Flipgazine dark ground sampled at ${width}/${scheme}`);
            if(consoleErrors.length||pageErrors.length) throw new Error(`console errors ${width}/${scheme}: ${JSON.stringify({consoleErrors,pageErrors})}`);
            for(const u of [BLACK,WHITE]) if(resourceStatus.get(u)!==200) throw new Error(`logo response not 200: ${u} => ${resourceStatus.get(u)}`);
            if(resourceStatus.get(AIR)!==200) throw new Error(`AirBKK response not 200: ${resourceStatus.get(AIR)}`);
            const fontResponses=[...resourceStatus].filter(([u])=>u.includes('/brand/vignette/v1/fonts/'));
            if(fontResponses.length<2 || fontResponses.some(([,s])=>s!==200)) throw new Error(`font responses bad: ${JSON.stringify(fontResponses)}`);

            if(width===390 && scheme==='light'){
              await page.click('#themeToggle');
              await page.waitForTimeout(650);
              const toggled=await page.getAttribute('html','data-theme');
              if(toggled!=='dark') throw new Error('theme toggle failed');
              await page.reload({waitUntil:'domcontentloaded',timeout:30000});
              await page.locator('#report').waitFor({state:'visible',timeout:20000});
              const persisted=await page.getAttribute('html','data-theme');
              if(persisted!=='dark') throw new Error('theme persistence failed');
              await page.waitForFunction(()=>document.querySelector('#report')?.getAttribute('aria-busy')==='false',{timeout:20000});
              const before=(await page.textContent('#pmValue'))?.trim();
              await context.setOffline(true);
              await page.click('#refreshBtn');
              await page.waitForFunction(()=>document.querySelector('#connection')?.getAttribute('data-state')==='offline',{timeout:15000});
              const after=(await page.textContent('#pmValue'))?.trim();
              if(!before||before==='—'||after!==before) throw new Error(`offline fallback failed ${before} -> ${after}`);
              await context.setOffline(false);
            }
            report.push({width,scheme,theme:data.theme,pm:data.pm,aqi:data.aqi,connection:data.connection,scale:data.scaleFirstColumns||data.scaleColumns,fonts:[data.vignetteFont,data.thaiFont],paintSamples:data.samples.length});
            await context.close();
          }

          try{
            for(const [w,h] of [[320,900],[390,900],[1440,1000]]) for(const s of ['light','dark']) await check(w,h,s);
            console.log('PM25_LIVE_CHECK_PASS');
            console.log(JSON.stringify(report,null,2));
          } finally { await browser.close(); }
          JS
          node /tmp/pm25-check.mjs

      - name: Remove one-shot workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pm25-final-check.yml
          git commit -m "chore: remove PM2.5 final live check" || true
          git push origin HEAD:pm25-final-check || true
