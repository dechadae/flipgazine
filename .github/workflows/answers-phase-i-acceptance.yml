name: Answers Phase I full acceptance

on:
  push:
    paths:
      - '.github/workflows/answers-phase-i-acceptance.yml'

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen v124 deterministic parity
        run: node answers-private-server/parity-v124-runner.mjs

  public-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full same-origin HTTP security, history, abuse, exposure and latency acceptance
        shell: bash
        run: |
          cat > /tmp/phase-i-http.mjs <<'NODE'
          import crypto from 'node:crypto';
          import {performance} from 'node:perf_hooks';
          const ORIGIN='https://flipgazine.pages.dev';
          const API=ORIGIN+'/api/answers';
          const SUPA='https://sjpvhgxacsiorrtijqua.supabase.co/functions/v1/answers-service';
          const PUB='sb_publishable_NcIExScIXkqsK1ZNNu5a-Q_zZ4afIHz';
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          function check(ok,msg){if(!ok)throw new Error(msg)}
          function cookieOf(res){const s=res.headers.get('set-cookie')||'';return s.split(';')[0]||''}
          async function post(path,body,cookie='',origin=ORIGIN){const t=performance.now();const res=await fetch(API+path,{method:'POST',headers:{'content-type':'application/json','origin':origin,...(cookie?{cookie}:{})},body:JSON.stringify(body)});const text=await res.text();let json={};try{json=JSON.parse(text)}catch{}return{res,json,text,ms:performance.now()-t,cookie:cookie||cookieOf(res)}}
          async function cycle(question,cookie=''){const p=await post('/prepare',{question},cookie);check(p.res.status===200,'cycle prepare '+p.res.status);const token=p.json.request_token;const r=await post('/reveal',{request_token:token},p.cookie);check(r.res.status===200,'cycle reveal '+r.res.status);return{prepare:p,reveal:r,cookie:p.cookie,id:r.json.id,totalMs:p.ms+r.ms}}

          const directNoKey=await fetch(SUPA,{method:'POST',headers:{'content-type':'application/json'},body:'{"action":"prepare","question":"x"}'});
          check(directNoKey.status===401,'direct endpoint without key must 401');
          const directPub=await fetch(SUPA,{method:'POST',headers:{apikey:PUB,'content-type':'application/json'},body:'{"action":"prepare","question":"x"}'});
          check(directPub.status===401,'direct endpoint with publishable key must 401');

          const evil=await post('/prepare',{question:'hello'},'','https://evil.example');
          check([401,403].includes(evil.res.status),'cross-origin request accepted');

          const normal=await post('/prepare',{question:'ควรไปกินหมูกระทะไหม'});
          check(normal.res.status===200,'normal prepare');
          check(Object.keys(normal.json).sort().join(',')==='expires_in,request_token','prepare leaks fields');
          check(/^[A-Za-z0-9_-]{43}$/.test(normal.json.request_token),'opaque token shape');
          check(normal.json.expires_in===120,'token TTL drift');
          check((normal.res.headers.get('cache-control')||'').includes('no-store'),'prepare cache control');
          const reveal=await post('/reveal',{request_token:normal.json.request_token},normal.cookie);
          check(reveal.res.status===200,'normal reveal');
          check(typeof reveal.json.thai==='string'&&reveal.json.thai.length>0&&typeof reveal.json.english==='string'&&reveal.json.english.length>0,'reveal payload');
          check(!('route' in reveal.json)&&!('pool' in reveal.json)&&!('eligible' in reveal.json),'reveal diagnostics leak');
          check((reveal.res.headers.get('cache-control')||'').includes('no-store'),'reveal cache control');
          const replay=await post('/reveal',{request_token:normal.json.request_token},normal.cookie);
          check(replay.res.status===404&&replay.json.error==='reveal_unavailable','replay not rejected');

          const sa=await post('/prepare',{question:'barista หล่อไหม'});
          const sb=await post('/prepare',{question:'คืนนี้ออกไปดีไหม'});
          const wrongSession=await post('/reveal',{request_token:sa.json.request_token},sb.cookie);
          check(wrongSession.res.status===404,'wrong session reveal accepted');
          const saReveal=await post('/reveal',{request_token:sa.json.request_token},sa.cookie);
          check(saReveal.res.status===200,'correct session after wrong-session attempt failed');

          const careP=await post('/prepare',{question:'I have chest pain should I take medicine?'});
          check(careP.res.status===200,'CARE prepare');
          check(Object.keys(careP.json).sort().join(',')==='expires_in,request_token','CARE leaked at prepare');
          const careR=await post('/reveal',{request_token:careP.json.request_token},careP.cookie);
          check(careR.res.status===200&&careR.json.id===null,'CARE reveal id');
          check(careR.json.english==='Ask a clinician. This book has no medical license.','CARE text drift');

          let outCookie='';const outstanding=[];
          for(let i=0;i<4;i++){const x=await post('/prepare',{question:'outstanding '+i},outCookie);outCookie=x.cookie||outCookie;outstanding.push(x.res.status)}
          check(outstanding.slice(0,3).every(x=>x===200)&&outstanding[3]===429,'outstanding-token abuse control '+outstanding.join(','));

          const exp=await post('/prepare',{question:'expiry probe'});
          check(exp.res.status===200,'expiry prepare');
          await sleep(122000);
          const expired=await post('/reveal',{request_token:exp.json.request_token},exp.cookie);
          check(expired.res.status===404,'expired token accepted');

          let histCookie='';const hist=[];
          for(let i=0;i<7;i++){const c=await cycle('phase-i-generic-'+i,histCookie);histCookie=c.cookie;hist.push(c.id)}
          check(hist.every(Number.isInteger),'recent history normal ids');
          check(new Set(hist).size===7,'recent-6 failed to prevent repeat with 75 Universals: '+hist.join(','));

          const bad=await post('/reveal',{request_token:'x'.repeat(43)},histCookie);
          check(bad.res.status===404,'bad token rejection');
          const recovered=await cycle('recovery works',histCookie);
          check(recovered.reveal.res.status===200,'failure recovery');

          const latency=[];let lc='';
          for(let i=0;i<3;i++){const c=await cycle('latency generic '+i,lc);lc=c.cookie;latency.push(Math.round(c.totalMs))}
          const sorted=[...latency].sort((a,b)=>a-b);const median=sorted[1];const max=Math.max(...latency);
          check(max<5000,'latency catastrophic '+max);

          const [labJsRes,labHtmlRes,prodJsRes,prodHtmlRes]=await Promise.all([
            fetch(ORIGIN+'/fg-page-answers-server-lab.js'),fetch(ORIGIN+'/answers-server-lab.html'),fetch(ORIGIN+'/fg-page-answers.js'),fetch(ORIGIN+'/answers.html')
          ]);
          check([labJsRes,labHtmlRes,prodJsRes,prodHtmlRes].every(r=>r.ok),'asset fetch failure');
          const [labJs,labHtml,prodJs,prodHtml]=await Promise.all([labJsRes.text(),labHtmlRes.text(),prodJsRes.text(),prodHtmlRes.text()]);
          const forbidden=['const ANSWERS','FOCUS_INDEX','function chooseAnswer','function resolve(question,dictionary,index'];
          for(const pat of forbidden)check(!labJs.includes(pat),'secure lab exposure: '+pat);
          check(!labJs.includes('/fg-page-answers.js'),'secure lab references public corpus controller');
          check(labJs.includes('/api/answers/prepare')&&labJs.includes('/api/answers/reveal'),'secure lab API path missing');
          check(Buffer.byteLength(labJs)<50000,'secure controller unexpectedly bulk');
          const prodMd5=crypto.createHash('md5').update(prodJs).digest('hex');
          check(prodMd5==='c8a382f0562737422e891e3300bb08f6','production v124 controller changed '+prodMd5);
          check(prodHtml.includes('/fg-page-answers.js'),'production cut over before Phase J');
          check(labHtml.includes('/fg-page-answers-server-lab.js'),'secure lab controller mismatch');

          console.log('PHASE_I_HTTP_RESULT='+JSON.stringify({status:'PASS',direct_no_key:directNoKey.status,direct_publishable_key:directPub.status,cross_origin:evil.res.status,prepare_fields:Object.keys(normal.json).sort(),ttl:normal.json.expires_in,reveal_id:reveal.json.id,replay:replay.res.status,wrong_session:wrongSession.res.status,care_id:careR.json.id,outstanding_statuses:outstanding,expiry_status:expired.res.status,recent_ids:hist,recent_unique:new Set(hist).size,recovery_id:recovered.id,latency_ms:latency,latency_median_ms:median,latency_max_ms:max,secure_lab_js_bytes:Buffer.byteLength(labJs),production_controller_md5:prodMd5}));
          NODE
          node /tmp/phase-i-http.mjs

  admin-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticated DB-native Admin boundary and audit acceptance
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(curl --fail --silent --show-error --max-time 180 'https://sjpvhgxacsiorrtijqua.supabase.co/functions/v1/answers-phase-i-admin-smoke?cap=fg-phase-i-admin-20260817-Q6v9Lm3R')"
          printf 'PHASE_I_ADMIN_RESULT=%s\n' "$OUT"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.status!=="PASS"||x.non_admin_audit_http!==403||x.admin_load_answers!==948||x.admin_load_revision!==124||x.stale_save_http!==409||x.invalid_save_http!==422||!x.admin_audit_shared_core||!x.no_store) process.exit(1)' "$OUT"

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        shell: bash
        run: |
          npm --silent --prefix /tmp/phase-i init -y >/dev/null 2>&1
          npm --silent --prefix /tmp/phase-i install playwright >/dev/null 2>&1
          cd /tmp/phase-i && npx playwright install chromium >/dev/null
      - name: Mobile interaction, theatrical-depth independence and recovery
        shell: bash
        run: |
          cat > /tmp/phase-i/mobile.mjs <<'NODE'
          import {chromium} from 'playwright';
          function check(ok,msg){if(!ok)throw new Error(msg)}
          const browser=await chromium.launch({headless:true});
          async function openAt(page,fraction){
            await page.waitForFunction(()=>document.body.dataset.stage==='pick');
            const b=await page.locator('#bookEdge').boundingBox();check(b&&b.width>100,'book bounds');
            await page.mouse.move(b.x+b.width*.2,b.y+b.height*.5);await page.mouse.down();await page.mouse.move(b.x+b.width*fraction,b.y+b.height*.5,{steps:8});await page.mouse.up();
            await page.waitForFunction(()=>document.body.dataset.stage==='open',{timeout:15000});
            return {thai:(await page.locator('#thaiAnswer').innerText()).trim(),english:(await page.locator('#englishAnswer').innerText()).trim()};
          }
          async function context(){return browser.newContext({viewport:{width:412,height:915},deviceScaleFactor:2.625,isMobile:true,hasTouch:true});}
          const c1=await context();const p1=await c1.newPage();
          await p1.goto('https://flipgazine.pages.dev/answers-server-lab.html',{waitUntil:'domcontentloaded'});
          await p1.waitForFunction(()=>document.body.dataset.stage==='ask');
          const initial=await p1.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,innerWidth:innerWidth,book:(()=>{const r=document.querySelector('#bookEdge').getBoundingClientRect();return{x:r.x,w:r.width,c:r.x+r.width/2}})()}));
          check(initial.scrollWidth<=initial.innerWidth+1,'horizontal overflow');check(Math.abs(initial.book.c-206)<12,'closed book off center');
          await p1.locator('#question').fill('barista หล่อไหม');await p1.locator('#questionForm button').click();
          await p1.waitForFunction(()=>document.body.dataset.stage==='pick');
          check(await p1.locator('#questionForm button').isDisabled(),'submit not disabled in pick');
          const a1=await openAt(p1,.82);check(a1.thai&&a1.english,'mobile normal blank');
          const openGeom=await p1.evaluate(()=>{const r=document.querySelector('.open-book').getBoundingClientRect();return{center:r.x+r.width/2,width:r.width,overflow:document.documentElement.scrollWidth-innerWidth}});
          check(Math.abs(openGeom.center-206)<15,'open book off center');check(openGeom.overflow<=1,'open stage overflow');
          check(await p1.locator('#askAgain').isEnabled(),'ask again disabled');
          await p1.locator('#askAgain').click();await p1.waitForFunction(()=>document.body.dataset.stage==='ask');
          await c1.close();

          const c2=await context();const p2=await c2.newPage();await p2.goto('https://flipgazine.pages.dev/answers-server-lab.html',{waitUntil:'domcontentloaded'});await p2.locator('#question').fill('I have chest pain should I take medicine?');await p2.locator('#questionForm button').click();const care=await openAt(p2,.18);check(care.english==='Ask a clinician. This book has no medical license.','mobile CARE drift');await c2.close();

          const c3=await context();const p3=await c3.newPage();let failed=false;await p3.route('**/api/answers/prepare',async route=>{if(!failed){failed=true;await route.fulfill({status:503,contentType:'application/json',body:'{"error":"service_unavailable"}'});}else await route.continue();});await p3.goto('https://flipgazine.pages.dev/answers-server-lab.html',{waitUntil:'domcontentloaded'});await p3.locator('#question').fill('recovery after one prepare failure');await p3.locator('#questionForm button').click();const recovered=await openAt(p3,.64);check(failed&&recovered.thai&&recovered.english,'mobile retry failed');await c3.close();
          await browser.close();
          console.log('PHASE_I_MOBILE_RESULT='+JSON.stringify({status:'PASS',viewport:'412x915',dpr:2.625,closed_book_center:initial.book.c,open_book_center:openGeom.center,open_book_width:openGeom.width,normal_answer:true,care_answer:true,first_prepare_intercepted:true,recovery_answer:true,depths_tested:[.82,.18,.64]}));
          NODE
          node /tmp/phase-i/mobile.mjs
