name: PM25 final validation

on:
  push:
    branches:
      - pm25-shell-scope-fix
    paths:
      - ".github/workflows/pm25-final-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pm25-shell-scope-fix
          fetch-depth: 1

      - name: Verify live shell and external resources
        run: |
          set -euo pipefail
          cb="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsSL -H 'Cache-Control: no-cache' "https://flipgazine.pages.dev/index.html?cb=$cb" -o /tmp/index.html
          grep -q 'fg-boot-dark' /tmp/index.html
          grep -q 'fg-boot-quiet' /tmp/index.html
          grep -q "var isQuiet=path==='/sindhornmidtown/pm25.html';" /tmp/index.html
          grep -q "The live air-quality report couldn\\'t be loaded" /tmp/index.html

          urls=(
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/vignette/v1/fonts/vignette-sans-light.woff'
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/vignette/v1/fonts/vignette-sans-regular.woff'
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/vignette/v1/fonts/vignette-sans-semibold.woff'
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/vignette/v1/fonts/ibm-plex-sans-thai-light.woff2'
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/vignette/v1/fonts/ibm-plex-sans-thai-regular.woff2'
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/vignette/v1/fonts/ibm-plex-sans-thai-semibold.woff2'
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/sindhorn-midtown/v1/sindhorn-midtown-vignette-black.png'
            'https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/sindhorn-midtown/v1/sindhorn-midtown-vignette-white.png'
          )
          for u in "${urls[@]}"; do
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' "$u")"
            test "$code" = 200 || { echo "resource failed $code $u"; exit 1; }
          done

          code="$(curl -sS -o /tmp/air.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"message":"Request data"}' 'https://stations.airbkk.com/api/web/data')"
          test "$code" = 200
          node -e "const j=require('/tmp/air.json'); if(j.status!=='Success'||!Array.isArray(j.message)||!j.message.some(x=>String(x.MeasIndex)==='114')) process.exit(1);"

      - name: Install Playwright Chromium
        run: |
          npm --silent init -y >/dev/null 2>&1
          npm --silent install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run live visual and behavior checks
        run: |
          cat > /tmp/check.mjs <<'JS'
          import { chromium } from 'playwright';
          const base='https://flipgazine.pages.dev/sindhornmidtown/pm25.html';
          const browser=await chromium.launch({headless:true});
          const cases=[[320,900],[390,900],[1440,1000]];
          const results=[];
          for(const [width,height] of cases){
            for(const scheme of ['light','dark']){
              const context=await browser.newContext({viewport:{width,height},colorScheme:scheme});
              const page=await context.newPage();
              const consoleErrors=[]; const pageErrors=[];
              page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
              page.on('pageerror',e=>pageErrors.push(String(e)));
              const url=base+`?cb=${Date.now()}-${width}-${scheme}`;
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
              await page.locator('#report').waitFor({state:'visible',timeout:20000});
              await page.waitForFunction(()=>document.querySelector('#report')?.getAttribute('aria-busy')==='false',{timeout:20000});
              await page.waitForTimeout(600);

              const data=await page.evaluate(()=>{
                const phraseRects=[...document.querySelectorAll('.hotel-name')].map(el=>{
                  const r=document.createRange(); r.selectNodeContents(el); const rects=[...r.getClientRects()];
                  return {text:el.textContent,rectCount:rects.length,lines:[...new Set(rects.map(x=>Math.round(x.top)))]};
                });
                const scale=document.querySelector('.scale-labels'); const first=scale.firstElementChild;
                return {
                  theme:document.documentElement.getAttribute('data-theme'),
                  bodyText:document.body.innerText,
                  phraseRects,
                  scaleCols:getComputedStyle(scale).gridTemplateColumns,
                  scaleRowDisplay:getComputedStyle(first).display,
                  scaleRowCols:getComputedStyle(first).gridTemplateColumns,
                  pm:document.querySelector('#pmValue').textContent.trim(),
                  aqi:document.querySelector('#aqiValue').textContent.trim(),
                  connection:document.querySelector('#connection').getAttribute('data-state'),
                  vignetteFont:getComputedStyle(document.querySelector('h1')).fontFamily,
                  thaiFont:getComputedStyle(document.querySelector('h1 [lang="th"]')).fontFamily,
                  fontLoadedVignette:document.fonts.check('16px "Vignette Sans"'),
                  fontLoadedThai:document.fonts.check('16px "IBM Plex Sans Thai"'),
                  hasManifest:!!document.querySelector('link[rel="manifest"]'),
                  hasFlipHeader:!!document.querySelector('header'),
                  bg:getComputedStyle(document.body).backgroundColor
                };
              });
              if(data.bodyText.toLowerCase().includes('flipgazine')) throw new Error(`visible Flipgazine text at ${width}/${scheme}`);
              if(data.hasManifest) throw new Error(`PWA manifest injected at ${width}/${scheme}`);
              if(data.hasFlipHeader) throw new Error(`Flipgazine header present at ${width}/${scheme}`);
              if(data.phraseRects.length!==2 || data.phraseRects.some(x=>x.lines.length!==1)) throw new Error(`hotel name wrapped at ${width}/${scheme}: ${JSON.stringify(data.phraseRects)}`);
              if(width<=520){ if(data.scaleRowDisplay!=='grid') throw new Error(`mobile scale not rows at ${width}`); }
              else { if(data.scaleCols.split(' ').length!==5) throw new Error('desktop scale not 5 columns'); }
              if(data.pm==='—'||data.aqi==='—') throw new Error(`no live reading at ${width}/${scheme}`);
              if(!['live','delayed'].includes(data.connection)) throw new Error(`unexpected online state ${data.connection}`);
              if(!data.fontLoadedVignette||!data.fontLoadedThai) throw new Error(`font not loaded ${JSON.stringify(data)}`);
              if(consoleErrors.length||pageErrors.length) throw new Error(`console/page errors ${width}/${scheme}: ${JSON.stringify({consoleErrors,pageErrors})}`);

              if(width===390 && scheme==='light'){
                const before=data.theme;
                await page.click('#themeToggle');
                const toggled=await page.getAttribute('html','data-theme');
                if(toggled===before) throw new Error('theme toggle did not change');
                await page.reload({waitUntil:'domcontentloaded'});
                await page.locator('#report').waitFor({state:'visible',timeout:20000});
                const persisted=await page.getAttribute('html','data-theme');
                if(persisted!==toggled) throw new Error('theme did not persist');
                await context.setOffline(true);
                await page.click('#refreshBtn');
                await page.waitForFunction(()=>document.querySelector('#connection')?.getAttribute('data-state')==='offline',{timeout:15000});
                const offlinePm=(await page.textContent('#pmValue'))?.trim();
                if(!offlinePm || offlinePm==='—') throw new Error('offline fallback lost cached reading');
                await context.setOffline(false);
              }
              results.push({width,scheme,data});
              await context.close();
            }
          }
          await browser.close();
          console.log(JSON.stringify(results,null,2));
          JS
          node /tmp/check.mjs

      - name: Remove one-shot validator from branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pm25-final-validation.yml
          git commit -m "chore: remove PM2.5 final validator" || true
          git push origin HEAD:pm25-shell-scope-fix || true
