name: Answers Phase E HTTP smoke

on:
  push:
    paths:
      - '.github/workflows/answers-phase-e-http-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exercise private prepare reveal flow
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(curl --fail --silent --show-error --max-time 60 'https://sjpvhgxacsiorrtijqua.supabase.co/functions/v1/answers-service-phase-e-smoke?cap=FPPEJZCfnlgQJVcAn8UmAmv6lzX9esQafX_HtgIpPMY')"
          printf '%s\n' "$OUT"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.status!=="PASS") process.exit(1);' "$OUT"
