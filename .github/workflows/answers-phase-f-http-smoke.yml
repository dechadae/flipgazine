name: Answers Phase F boundary smoke

on:
  push:
    paths:
      - '.github/workflows/answers-phase-f-http-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exercise same-origin Answers boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://flipgazine.pages.dev'
          UPSTREAM='https://sjpvhgxacsiorrtijqua.supabase.co/functions/v1/answers-service'
          ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNqcHZoZ3hhY3Npb3JydGlqcXVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NDE5MjcsImV4cCI6MjA5OTMxNzkyN30.9rQa7r9pxoBwh5SrYLlBGzzvbZkkUXKdvahCPugZncY'
          T="$(mktemp -d)"
          trap 'rm -rf "$T"' EXIT

          prepare() {
            local jar="$1" question="$2" body="$3" headers="$4"
            touch "$jar"
            curl --silent --show-error --max-time 60 \
              -D "$headers" -o "$body" -c "$jar" -b "$jar" \
              -H 'content-type: application/json' -H "origin: $BASE" \
              -X POST "$BASE/api/answers/prepare" \
              --data "$(node -e 'process.stdout.write(JSON.stringify({question:process.argv[1]}))' "$question")" \
              -w '%{http_code}'
          }

          token_from() {
            node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const k=Object.keys(x).sort().join(","); if(k!=="expires_in,request_token"||x.expires_in!==120||!/^[A-Za-z0-9_-]{43}$/.test(x.request_token)) process.exit(1); process.stdout.write(x.request_token)' "$1"
          }

          reveal() {
            local jar="$1" token="$2" body="$3" headers="$4"
            curl --silent --show-error --max-time 60 \
              -D "$headers" -o "$body" -b "$jar" \
              -H 'content-type: application/json' -H "origin: $BASE" \
              -X POST "$BASE/api/answers/reveal" \
              --data "{\"request_token\":\"$token\"}" -w '%{http_code}'
          }

          session_hash() {
            local sid
            sid="$(awk '$6=="fg_ans_sid" {print $7}' "$1" | tail -1)"
            test -n "$sid"
            printf '%s' "$sid" | sha256sum | awk '{print $1}'
          }

          B="$T/body"; H="$T/headers"; C1="$T/c1"; touch "$C1"

          CODE="$(prepare "$C1" 'มัทฉะหรือชาไทยดี?' "$B" "$H")"
          test "$CODE" = '200'
          grep -qi '^cache-control: no-store, private, max-age=0' "$H"
          grep -q 'fg_ans_sid' "$C1"
          TOKEN="$(token_from "$B")"

          CODE="$(reveal "$C1" "$TOKEN" "$B" "$H")"
          test "$CODE" = '200'
          grep -qi '^cache-control: no-store, private, max-age=0' "$H"
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!Number.isInteger(x.id)||typeof x.thai!=="string"||!x.thai||typeof x.english!=="string"||!x.english) process.exit(1)' "$B"

          CODE="$(reveal "$C1" "$TOKEN" "$B" "$H")"
          test "$CODE" = '404'

          CODE="$(prepare "$C1" 'คืนนี้ออกไปเจอเพื่อนดีปะ?' "$B" "$H")"
          test "$CODE" = '200'
          TOKEN2="$(token_from "$B")"
          CWRONG="$T/wrong"; touch "$CWRONG"
          CODE="$(reveal "$CWRONG" "$TOKEN2" "$B" "$H")"
          test "$CODE" = '404'

          CODE="$(prepare "$C1" 'ปวดหน้าอกควรทำไง' "$B" "$H")"
          test "$CODE" = '200'
          CARE_TOKEN="$(token_from "$B")"
          CODE="$(reveal "$C1" "$CARE_TOKEN" "$B" "$H")"
          test "$CODE" = '200'
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(x.id!==null||typeof x.thai!=="string"||!x.thai||typeof x.english!=="string"||!x.english) process.exit(1)' "$B"

          CODE="$(curl --silent --show-error --max-time 30 -o "$B" -H 'content-type: application/json' -H 'origin: https://example.com' -X POST "$BASE/api/answers/prepare" --data '{"question":"hello"}' -w '%{http_code}')"
          test "$CODE" = '403'
          LONG="$(node -e 'process.stdout.write("x".repeat(501))')"
          CODE="$(curl --silent --show-error --max-time 30 -o "$B" -H 'content-type: application/json' -H "origin: $BASE" -X POST "$BASE/api/answers/prepare" --data "$(node -e 'process.stdout.write(JSON.stringify({question:process.argv[1]}))' "$LONG")" -w '%{http_code}')"
          test "$CODE" = '413'

          CODE="$(curl --silent --show-error --max-time 30 -o "$B" -H 'content-type: application/json' -X POST "$UPSTREAM" --data '{"action":"prepare","question":"hello"}' -w '%{http_code}')"
          test "$CODE" = '401'
          CODE="$(curl --silent --show-error --max-time 30 -o "$B" -H 'content-type: application/json' -H "apikey: $ANON" -X POST "$UPSTREAM" --data '{"action":"prepare","question":"hello"}' -w '%{http_code}')"
          test "$CODE" = '401'

          C2="$T/c2"; touch "$C2"
          for n in 1 2 3; do
            CODE="$(prepare "$C2" "outstanding token test $n" "$B" "$H")"
            test "$CODE" = '200'
            token_from "$B" >/dev/null
          done
          CODE="$(prepare "$C2" 'outstanding token test 4' "$B" "$H")"
          test "$CODE" = '429'
          grep -qi '^retry-after:' "$H"

          S1="$(session_hash "$C1")"
          S2="$(session_hash "$C2")"
          printf 'PHASE_F_HTTP_SMOKE_RESULT={"status":"PASS","prepare_token_only":true,"normal_reveal":true,"replay_rejected":true,"session_bound":true,"care_tokenized":true,"cross_origin_rejected":true,"direct_bypass_rejected":true,"no_store":true,"outstanding_token_limit":3,"session_hashes":["%s","%s"]}\n' "$S1" "$S2"
