name: Answers Phase H gated report

on:
  push:
    paths:
      - '.github/workflows/answers-phase-h-report.yml'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for exact parity proof
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 50); do
            git fetch origin main
            if git cat-file -e origin/main:answers-private-server/phase-h-parity-proof.json 2>/dev/null; then
              git checkout main
              git pull --ff-only origin main
              node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("answers-private-server/phase-h-parity-proof.json","utf8"));if(x.status!=="PASS"||x.generatedQuestions!==5386||x.routeCases!==64626||x.routeDifferences!==0||x.careCases!==6||x.normalChooseAnswerCases!==15||x.finalFallbackCases!==4||!x.invariants?.exactlyTwoUniversalOnMatchedNonGeneric||!x.invariants?.uniformProbabilityOneOverEligible)process.exit(2)'
              exit 0
            fi
            sleep 15
          done
          exit 3
      - name: Write Phase H report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          proof=json.loads(Path('answers-private-server/phase-h-parity-proof.json').read_text())
          proof_json=json.dumps(proof,ensure_ascii=False,indent=2)
          report=f'''# The Book of Answers — Private Server Migration Phase H Report

**Status:** PHASE H COMPLETE — DB-NATIVE ADMIN PASS  
**Date:** 17 August 2026  
**Supabase project:** `sjpvhgxacsiorrtijqua` (`ap-southeast-1`)  
**Canonical frozen behavior:** `/fg-page-answers.js` v124  
**Public Book cutover:** **NOT PERFORMED**

