Before Phase H, `/answers-admin.html` loaded `/fg-page-answers-admin.js`, which fetched `/fg-page-answers.js` from `site_files`, evaluated/parsing the production JavaScript, rebuilt `FOCUS_INDEX` client-side and rewrote the giant controller on save.

