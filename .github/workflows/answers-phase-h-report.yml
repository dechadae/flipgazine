## H2. Private corpus revision model

Phase H added `private.answer_corpus_revisions` and the private save/index helpers needed to make the database an operable corpus source of truth.

The Phase H migration set includes:

- `answers_private_phase_h_admin_revision_model`;
- `answers_private_phase_h_preserve_copy_bytes`;
- `answers_private_phase_h_preserve_tag_order`;
- `answers_private_phase_h_universal_guard`;
- `answers_private_phase_h_runtime_current_revision`;
- `answers_private_phase_h_admin_json_compat`.

The revision ledger stores parent revision, editor, source, active-answer count, maximum answer ID, corpus hash, routing-index hash and creation time. RLS is enabled and no client role has private-schema/table access.

The seeded frozen revision is:

- revision **124**;
- active answers **948**;
- max answer ID **948**;
- corpus MD5 **`46ef8b51cf90d847523b82d823c6e796`**;
