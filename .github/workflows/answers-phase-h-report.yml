| `/wip/answers-private-server-phase-h/fg-page-answers-admin-v22-raw-js-rollback.js` | 22 | 25,645 | `35153068bc4ade1e97ae9b0490bf2f65` |

These WIP copies are rollback artifacts only and remain excluded from anonymous `site_files` reads.

