- regenerated index is exact JSON equality with the imported v124 index.

No revision 125 was left persisted during Phase H testing.

---

## H3. Transactional Admin save contract

`private.answer_admin_save(...)` / `private.answer_admin_save_guarded(...)` implement optimistic revision concurrency and transactional index regeneration.

The save contract preserves the existing Admin semantics:

- Thai and English copy are required; stored copy bytes are not silently normalized;
- tag lists are lowercased, trimmed and deduplicated while preserving first-seen order;
- Focus tags must exist as frozen dictionary Focus/Slang concepts;
- Support tags must exist as Focus/Slang/Support concepts;
- Topics are restricted to the existing 20-topic catalog;
- Helpers are restricted to `general`, `decision`, `timing`, `universal`;
- Universal answers cannot own Focus, Support or Topic tags;
- at least **2 active Universal answers** must remain;
- duplicate Thai copy is rejected using the pre-H whitespace-collapse/lowercase rule;
- stale expected revision returns a conflict;
- save refuses to change the corpus while a prepared unrevealed answer token is live.

Stable answer IDs are now explicit DB semantics:

- existing IDs are never renumbered;
- a deleted Admin row becomes `active=false`;
- new answers receive IDs above the historical maximum;
- routing-index regeneration includes active rows only.

Rollback tests proved:

1. a no-op full save produces candidate revision 125 with the same corpus/index hashes, then rolls back;
2. editing answer 1 produces revision 125 and an exact regenerated index, then rolls back;
3. deleting ID 1 and adding one new Universal makes ID 1 inactive, allocates new ID **949**, places 949 in the Universal index, keeps 948 active rows, then rolls back.

---

## H4. Shared canonical routing core

The canonical server routing module was moved to:

`supabase/functions/_shared/router-v124.mjs`

The service-specific router files are re-export wrappers. The shared file returned to the original Git blob **`5c9af9d03652a07c450cc21be53c463b921587d2`** before Phase H completion.

A Phase H compatibility attempt briefly changed the emergency final fallback to filter via `answerExists()`. The deterministic parity harness caught that semantic difference in its deliberately adversarial missing-index/forced-missing fallback fixture. The change was **rejected and reverted**; the exact v124 emergency fallback is preserved.

Sparse/deactivated-ID safety therefore sits outside the sacred routing core: generated indexes contain active IDs, the runtime passes an active-ID existence predicate, and the service refuses to commit/reveal a selected normal ID that is not active.

---

## H5. Revision-aware public answer service

The public private-service backend is now revision-aware rather than hardcoded to corpus revision 124.

`answers-service` uses:

- `private.answer_prepare_claim_current(...)` to load the latest revision, its routing assets, active IDs and max ID;
- the unchanged v124 `chooseAnswer()` core;
- `private.answer_prepare_commit(...)` to bind the selected answer/CARE payload to the token revision;
- `private.answer_reveal_guarded_current(...)` so reveal/usage logging follows the request's own corpus revision.

The final Phase H deployment is `answers-service` **v7** on function ID `97eff1fe-ac32-42b9-a6dd-afa6ef7d0282`.

A final real Cloudflare-boundary runtime smoke passed:

- prepare: **200**;
- prepare body: token + 120-second TTL only;
- reveal: **200** with one bilingual answer;
- replay: **404**;
- no-store headers preserved;
- stored request corpus revision: **124**.

Cleanup was guarded: test state was removed only after asserting exactly one test session with exactly one revision-124 request, successful reveal, prepare/reveal usage events and replay rejection. Final interaction state returned to zero.

---

## H6. Authenticated private Admin API

Phase H deployed `answers-admin-service` with Supabase platform JWT verification enabled.

Authorization is layered:

1. a valid signed-in Supabase JWT is required by the Edge gateway;
2. the service validates that the JWT `sub` + `session_id` still correspond to a live Auth user/session;
3. the DB request context is set to that user;
4. `public.is_fg_admin()` must succeed;
5. otherwise the request is rejected before private corpus data is returned.

The service exposes only authenticated Admin operations:

- `load` — current private corpus, current revision, dictionary and allowed tag catalogs;
- `save` — guarded full-corpus transaction with expected revision;
- `audit` — deterministic server-side dry routing through the shared canonical `resolve()` core, with no answer token/recent-history mutation.

A disposable-account HTTP test proved:

```json
{{
  "status": "PASS",
  "non_admin_403": true,
  "admin_load_948": true,
  "audit_shared_core": true,
  "stale": {{ "http": 409, "status": "conflict", "current_revision": 124 }},
  "invalid": {{ "http": 422, "status": "invalid", "error": "insufficient_universal", "minimum": 2, "actual": 1 }}
}}
```

Browser CORS preflight from `https://flipgazine.pages.dev` also passed with HTTP **204**, matching allow-origin and POST support.

All disposable Auth users, automatically generated test connection rows, test Admin membership and test usage records were removed by exact IDs. The smoke function was replaced by an HTTP 410 tombstone.

