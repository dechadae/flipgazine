name: Answers Library rebuild smoke
on:
  push:
    paths:
      - '.github/workflows/answers-library-rebuild-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Validate exact live Answers Library files
        shell: bash
        env:
          SUPA: https://sjpvhgxacsiorrtijqua.supabase.co
          APIKEY: sb_publishable_NcIExScIXkqsK1ZNNu5a-Q_zZ4afIHz
        run: |
          set -euo pipefail
          curl -fsS "$SUPA/rest/v1/site_files?path=eq.%2Fanswers-admin.html&select=content,version" -H "apikey: $APIKEY" > /tmp/page.json
          test "$(jq -r '.[0].version' /tmp/page.json)" = "47"
          jq -r '.[0].content' /tmp/page.json > /tmp/page.html
          grep -q 'data-fg-persist="interactive-v1"' /tmp/page.html
          grep -q 'data-fg-controller="/fg-page-answers-admin.js"' /tmp/page.html
          grep -q '1.06s var(--ease-soft,cubic-bezier(.4,0,.2,1)) backwards' /tmp/page.html
          grep -q 'max-width:720px' /tmp/page.html
          grep -q 'Answers · canonical corpus' /tmp/page.html
          grep -q 'id="pager"' /tmp/page.html
          grep -q 'id="pagePrev"' /tmp/page.html
          grep -q 'id="pageNext"' /tmp/page.html
          ! grep -q 'Open Answers' /tmp/page.html
          ! grep -q 'Thai Audit' /tmp/page.html
          ! grep -q '>Reload<' /tmp/page.html

          curl -fsS "$SUPA/rest/v1/site_files?path=eq.%2Ffg-page-answers-admin.js&select=content,version" -H "apikey: $APIKEY" > /tmp/controller.json
          test "$(jq -r '.[0].version' /tmp/controller.json)" = "24"
          jq -r '.[0].content' /tmp/controller.json > /tmp/controller.js
          node --check /tmp/controller.js
          grep -q 'PAGE_SIZE=50' /tmp/controller.js
          grep -q 'pageRows=rows.slice' /tmp/controller.js
          grep -q 'pagePrev.addEventListener' /tmp/controller.js
          grep -q 'expected_revision:loadedRevision' /tmp/controller.js
          grep -q 'answers-admin-service' /tmp/controller.js
          ! grep -q 'reloadBtn' /tmp/controller.js
          test $(( (948 + 49) / 50 )) -eq 19
          echo '{"status":"PASS","page_version":47,"controller_version":24,"page_size":50,"full_pages":19}'
