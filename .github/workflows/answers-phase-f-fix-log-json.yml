name: Patch Answers Phase F structured log JSON

on:
  push:
    paths:
      - '.github/workflows/answers-phase-f-fix-log-json.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch JSONB parameter serialization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/answers-service/index.ts')
          s = p.read_text()
          old = '      })}::jsonb'
          new = '      })}::text::jsonb'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one log metadata cast, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/answers-service/index.ts
          git commit -m 'Fix Answers structured usage metadata JSONB'
          git push
