name: Answers Phase J non-admin smoke
on:
  push:
    paths:
      - '.github/workflows/answers-phase-j-nonadmin-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticated non-admin must receive 403
        shell: bash
        run: |
          set -euo pipefail
          out=$(curl -sS -w '\n%{http_code}' -X POST \
            -H 'x-phase-j-probe: phase-j-20260817-nonadmin-9f7b1b0b5a384d90' \
            https://sjpvhgxacsiorrtijqua.supabase.co/functions/v1/answers-phase-j-nonadmin-smoke)
          body=$(printf '%s' "$out" | sed '$d')
          code=$(printf '%s' "$out" | tail -n1)
          printf 'PHASE_J_NONADMIN=%s HTTP=%s\n' "$body" "$code"
          test "$code" = 200
          printf '%s' "$body" | grep -q '"status":"PASS"'
          printf '%s' "$body" | grep -q '"non_admin_audit_http":403'
