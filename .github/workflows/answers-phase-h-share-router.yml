name: Answers Phase H apply runtime patch

on:
  push:
    paths:
      - '.github/workflows/answers-phase-h-share-router.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply runtime patch
        run: python answers-private-server/phase-h-runtime-patch.py
      - name: Commit runtime patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/_shared/router-v124.mjs supabase/functions/answers-service/index.ts
          git commit -m 'Make Answers runtime revision-aware'
          git push
