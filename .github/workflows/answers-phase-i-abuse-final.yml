name: Answers Phase I abuse final

on:
  push:
    paths:
      - '.github/workflows/answers-phase-i-abuse-final.yml'
permissions:
  contents: read
jobs:
  abuse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove same-origin IP prepare ceiling
        shell: bash
        run: |
          cat > /tmp/phase-i-abuse.mjs <<'NODE'
          const A='https://flipgazine.pages.dev/api/answers/prepare';
          const statuses=[];
          for(let i=0;i<21;i++){
            const res=await fetch(A,{method:'POST',headers:{'content-type':'application/json','origin':'https://flipgazine.pages.dev'},body:JSON.stringify({question:'phase-i-ip-abuse-'+i})});
            statuses.push(res.status);
          }
          const pass=statuses.slice(0,20).every(x=>x===200)&&statuses[20]===429;
          console.log('PHASE_I_ABUSE_FINAL='+JSON.stringify({status:pass?'PASS':'FAIL',prepare_ip_statuses:statuses,allowed_before_block:statuses.filter(x=>x===200).length,blocked_status:statuses[20]}));
          if(!pass)process.exit(1);
          NODE
          node /tmp/phase-i-abuse.mjs
