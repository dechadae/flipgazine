name: Answers Phase J mobile fit diagnostic
on:
  push:
    paths:
      - '.github/workflows/answers-phase-j-mobile-fit-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir -p /tmp/phase-j-fit && cd /tmp/phase-j-fit
          npm --silent init -y >/dev/null 2>&1
          npm --silent install playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Compare production and accepted lab with answer 870
        shell: bash
        run: |
          cat > /tmp/phase-j-fit/diag.mjs <<'NODE'
          import {chromium} from 'playwright';
          const answer={id:870,thai:'เขาจำเมนูได้\nให้ทิปใจ 5% พอ',english:'They remember your order. Tip the heart five percent and stop there.'};
          const browser=await chromium.launch({headless:true});
          async function run(path){
            const ctx=await browser.newContext({viewport:{width:412,height:915},deviceScaleFactor:2.625,isMobile:true,hasTouch:true});
            const p=await ctx.newPage();
            await p.route('**/api/answers/reveal',async route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(answer)}));
            await p.goto('https://flipgazine.pages.dev/'+path+'?fitdiag='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForFunction(()=>document.body?.dataset?.stage==='ask'&&document.querySelector('#bookEdge'),null,{timeout:60000});
            await p.locator('#question').fill('barista หล่อไหม'); await p.locator('#questionForm button').click();
            await p.waitForFunction(()=>document.body?.dataset?.stage==='pick',null,{timeout:30000});
            await p.evaluate(()=>{const el=document.querySelector('#bookEdge'),r=el.getBoundingClientRect(),y=r.top+r.height/2,orig=el.setPointerCapture;el.setPointerCapture=()=>{};const fire=(t,x,b)=>el.dispatchEvent(new PointerEvent(t,{bubbles:true,cancelable:true,pointerId:91,pointerType:'touch',isPrimary:true,clientX:x,clientY:y,buttons:b,button:0}));fire('pointerdown',r.left+r.width*.2,1);fire('pointermove',r.left+r.width*.82,1);fire('pointerup',r.left+r.width*.82,0);el.setPointerCapture=orig;});
            await p.waitForFunction(()=>document.body?.dataset?.stage==='open',null,{timeout:30000});
            if(await p.evaluate(()=>!!document.fonts?.ready))await p.evaluate(()=>document.fonts.ready);
            await p.waitForTimeout(1500);
            const state=await p.evaluate(()=>{const t=document.querySelector('#thaiAnswer'),page=t.closest('.page-right'),ps=getComputedStyle(page),ts=getComputedStyle(t),maxWidth=Math.max(1,page.clientWidth-(parseFloat(ps.paddingLeft)||0)-(parseFloat(ps.paddingRight)||0)-2);return{fontSize:ts.fontSize,lineHeight:ts.lineHeight,clientWidth:t.clientWidth,scrollWidth:t.scrollWidth,clientHeight:t.clientHeight,scrollHeight:t.scrollHeight,pageClientWidth:page.clientWidth,paddingLeft:ps.paddingLeft,paddingRight:ps.paddingRight,maxWidth,children:[...t.children].map((x,i)=>({i,text:x.innerText,scrollWidth:x.scrollWidth,clientWidth:x.clientWidth,rectWidth:x.getBoundingClientRect().width,fontSize:getComputedStyle(x).fontSize})),heightFit:t.scrollHeight<=t.clientHeight+1,childrenFit:[...t.children].every(x=>x.scrollWidth<=maxWidth+1),bodyStage:document.body.dataset.stage};});
            await ctx.close(); return state;
          }
          const prod=await run('answers.html'); const lab=await run('answers-server-lab.html');
          console.log('PHASE_J_FIT_DIAG='+JSON.stringify({prod,lab,same:JSON.stringify(prod)===JSON.stringify(lab)}));
          await browser.close();
          NODE
          node /tmp/phase-j-fit/diag.mjs
