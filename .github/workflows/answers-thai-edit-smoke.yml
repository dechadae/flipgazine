name: Answers Thai Edit smoke
on:
  push:
    paths:
      - '.github/workflows/answers-thai-edit-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact live site_files and validate controller
        shell: bash
        env:
          SUPA: https://sjpvhgxacsiorrtijqua.supabase.co
          APIKEY: sb_publishable_NcIExScIXkqsK1ZNNu5a-Q_zZ4afIHz
        run: |
          set -euo pipefail
          curl -fsS "$SUPA/rest/v1/site_files?path=eq.%2Ffg-page-answers-thai-review.js&select=content,version" \
            -H "apikey: $APIKEY" > /tmp/controller.json
          test "$(jq -r '.[0].version' /tmp/controller.json)" = "4"
          jq -r '.[0].content' /tmp/controller.json > /tmp/controller.js
          node --check /tmp/controller.js
          grep -q 'answers-admin-service' /tmp/controller.js
          ! grep -q '/wip/' /tmp/controller.js
          ! grep -q 'new Function' /tmp/controller.js
          grep -q 'action:"save"' /tmp/controller.js
          grep -q 'expected_revision:loadedRevision' /tmp/controller.js
          curl -fsS "$SUPA/rest/v1/site_files?path=eq.%2Fanswers-thai-review.html&select=content,version" \
            -H "apikey: $APIKEY" > /tmp/page.json
          test "$(jq -r '.[0].version' /tmp/page.json)" = "3"
          jq -r '.[0].content' /tmp/page.json | grep -q 'Thai Edit</h1>'
          jq -r '.[0].content' /tmp/page.json | grep -q 'Save edit live'
          echo '{"status":"PASS","controller_version":4,"page_version":3}'
