name: Answers Phase G secure lab browser smoke

on:
  push:
    paths:
      - '.github/workflows/answers-phase-g-lab-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Syntax-check live lab controller bytes
        shell: bash
        run: |
          set -euo pipefail
          ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYXNlIiwicmVmIjoic2pwdmhneGFjc2lvcnJ0aWpxdWEiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4Mzc0MTkyNywiZXhwIjoyMDk5MzE3OTI3fQ.9rQa7r9pxoBwh5SrYLlBGzzvbZkkUXKdvahCPugZncY'
          curl --fail --silent --show-error \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            'https://sjpvhgxacsiorrtijqua.supabase.co/rest/v1/site_files?path=eq.%2Ffg-page-answers-server-lab.js&select=content' > row.json
          node -e 'const fs=require("fs"); const rows=JSON.parse(fs.readFileSync("row.json","utf8")); if(!rows[0]?.content) process.exit(2); fs.writeFileSync("lab-controller.js",rows[0].content); console.log("LAB_BYTES="+Buffer.byteLength(rows[0].content));'
          node --check lab-controller.js
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Exercise secure lab on mobile profile
        shell: bash
        run: |
          set -euo pipefail
          cat > phase-g-smoke.mjs <<'NODE'
          import { chromium } from 'playwright';
          const BASE='https://flipgazine.pages.dev';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:412,height:915},deviceScaleFactor:2.625,isMobile:true,hasTouch:true,locale:'th-TH'});
          const page=await context.newPage();
          const consoleErrors=[]; const pageErrors=[]; const apiRequests=[]; const apiResponses=[];
          page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
          page.on('pageerror',e=>pageErrors.push(String(e)));
          page.on('request',r=>{ if(r.url().includes('/api/answers/')){ let body=null; try{body=JSON.parse(r.postData()||'null')}catch{} apiRequests.push({url:r.url(),body,at:Date.now()}); }});
          page.on('response',r=>{ if(r.url().includes('/api/answers/')) apiResponses.push({url:r.url(),status:r.status(),at:Date.now()}); });

          async function stage(name,timeout=30000){ await page.waitForFunction(n=>document.body.getAttribute('data-stage')===n,name,{timeout}); }
          async function dragRelease(frac=.5){ const box=await page.locator('#bookEdge').boundingBox(); if(!box) throw new Error('book edge missing'); const y=box.y+box.height*.55; const x0=box.x+box.width*.18; const x1=box.x+box.width*frac; await page.mouse.move(x0,y); await page.mouse.down(); await page.mouse.move(x1,y,{steps:6}); await page.mouse.up(); }
          async function askAndOpen(question,frac=.5){
            await page.locator('#question').fill(question); const tSubmit=Date.now(); await page.getByRole('button',{name:'ถามดิ'}).click(); await stage('pick'); const tRelease=Date.now(); await dragRelease(frac); await stage('opening'); const tOpening=Date.now(); await stage('open'); const thai=(await page.locator('#thaiAnswer').innerText()).trim(); const english=(await page.locator('#englishAnswer').innerText()).trim(); if(!thai||!english) throw new Error('blank bilingual answer'); const prep=apiResponses.find(x=>x.url.endsWith('/prepare')&&x.at>=tSubmit); return {tSubmit,tRelease,tOpening,prepareMs:prep?prep.at-tSubmit:null,releaseToOpeningMs:tOpening-tRelease};
          }

          await page.goto(BASE+'/answers-server-lab.html',{waitUntil:'domcontentloaded',timeout:30000});
          await page.locator('#question').waitFor({state:'visible',timeout:30000});
          await stage('ask');
          await page.waitForTimeout(2500);
          const registration=await page.evaluate(()=>({
            fgModules:typeof window.FGModules,
            fgNav:typeof window.FGNav,
            controllerKeys:Object.keys(window.FGPageControllers||{}),
            labType:typeof (window.FGPageControllers||{})['/fg-page-answers-server-lab.js'],
            buttonDisabled:document.querySelector('#questionForm button')?.disabled,
            stage:document.body.getAttribute('data-stage')
          }));
          console.log('LAB_REGISTRATION='+JSON.stringify(registration));
          if(pageErrors.length) console.log('LAB_PAGE_ERRORS='+JSON.stringify(pageErrors));
          if(consoleErrors.length) console.log('LAB_CONSOLE_ERRORS='+JSON.stringify(consoleErrors));
          if(registration.labType!=='object') throw new Error('lab controller did not register');

          const normal=await askAndOpen('มัทฉะหรือชาไทยดี?',.25);
          const prepReq=apiRequests.find(x=>x.url.endsWith('/prepare')); const revealReq=apiRequests.find(x=>x.url.endsWith('/reveal'));
          if(!prepReq||JSON.stringify(Object.keys(prepReq.body||{}).sort())!==JSON.stringify(['question'])) throw new Error('prepare payload leaked extra fields');
          if(!revealReq||JSON.stringify(Object.keys(revealReq.body||{}).sort())!==JSON.stringify(['request_token'])) throw new Error('reveal payload leaked extra fields');
          if('depth' in (prepReq.body||{})||'position' in (prepReq.body||{})) throw new Error('depth influenced prepare payload');

          await page.getByRole('button',{name:'ถามอีกดิ'}).click(); await stage('ask');
          const care=await askAndOpen('ปวดหน้าอกควรทำไง',.82);
          const answerNumber=(await page.locator('#answerNumber').innerText()).trim(); if(answerNumber!=='—') throw new Error('CARE did not render null answer number');

          await page.getByRole('button',{name:'ถามอีกดิ'}).click(); await stage('ask');
          await page.route('**/api/answers/prepare',route=>route.abort('failed'));
          await page.locator('#question').fill('คืนนี้ออกไปเจอเพื่อนดีปะ?'); await page.getByRole('button',{name:'ถามดิ'}).click(); await stage('pick'); await dragRelease(.62);
          await page.waitForFunction(()=>document.body.getAttribute('data-stage')==='pick' && /เน็ตงอแง/.test(document.querySelector('#edgeHint')?.textContent||''),null,{timeout:10000});
          await page.unroute('**/api/answers/prepare'); await dragRelease(.62); await stage('opening'); await stage('open');

          const thaiBox=await page.locator('#thaiAnswer').evaluate(el=>({scrollHeight:el.scrollHeight,clientHeight:el.clientHeight,fontSize:getComputedStyle(el).fontSize})); if(thaiBox.scrollHeight>thaiBox.clientHeight+2) throw new Error('Thai answer overflow after autofit');
          if(pageErrors.length) throw new Error('pageerror: '+pageErrors.join(' | '));
          const relevantConsole=consoleErrors.filter(x=>!/favicon|Failed to load resource/.test(x)); if(relevantConsole.length) throw new Error('console error: '+relevantConsole.join(' | '));
          console.log('PHASE_G_BROWSER_RESULT='+JSON.stringify({status:'PASS',viewport:'412x915@2.625',prepare_payload_keys:Object.keys(prepReq.body),reveal_payload_keys:Object.keys(revealReq.body),normal_prepare_ms:normal.prepareMs,normal_release_to_opening_ms:normal.releaseToOpeningMs,care_prepare_ms:care.prepareMs,care_release_to_opening_ms:care.releaseToOpeningMs,care_rendered:true,network_failure_kept_book_closed:true,retry_recovered:true,thai_autofit:true,page_errors:0}));
          await browser.close();
          NODE
          node phase-g-smoke.mjs
