name: Answers Thai Audit fix smoke
on:
  push:
    paths:
      - '.github/workflows/answers-thai-audit-fix-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Validate live controller and devnav
        shell: bash
        env:
          SUPA: https://sjpvhgxacsiorrtijqua.supabase.co
          APIKEY: sb_publishable_NcIExScIXkqsK1ZNNu5a-Q_zZ4afIHz
        run: |
          set -euo pipefail
          curl -fsS "$SUPA/rest/v1/site_files?path=eq.%2Ffg-page-answers-thai-review.js&select=content,version" -H "apikey: $APIKEY" > /tmp/controller.json
          test "$(jq -r '.[0].version' /tmp/controller.json)" = "6"
          jq -r '.[0].content' /tmp/controller.json > /tmp/controller.js
          node --check /tmp/controller.js
          ! grep -q 'progressBar.style.width' /tmp/controller.js
          ! grep -q 'querySelector("#progressBar")' /tmp/controller.js
          grep -q 'answers-admin-service' /tmp/controller.js
          grep -q 'expected_revision:loadedRevision' /tmp/controller.js
          curl -fsS "$SUPA/rest/v1/site_files?path=eq.%2Ffg-devnav.js&select=content,version" -H "apikey: $APIKEY" > /tmp/devnav.json
          test "$(jq -r '.[0].version' /tmp/devnav.json)" = "30"
          jq -r '.[0].content' /tmp/devnav.json > /tmp/devnav.js
          node --check /tmp/devnav.js
          a=$(grep -n "id:'fgAnswersEditorChip'" /tmp/devnav.js | cut -d: -f1)
          b=$(grep -n "id:'fgThaiAuditChip'" /tmp/devnav.js | cut -d: -f1)
          c=$(grep -n "id:'fgClaudeChip'" /tmp/devnav.js | cut -d: -f1)
          test -n "$a" && test -n "$b" && test -n "$c"
          test "$a" -lt "$b" && test "$b" -lt "$c"
          grep -q "href:'/answers-thai-review.html', label:'thai audit'" /tmp/devnav.js
          echo '{"status":"PASS","controller_version":6,"devnav_version":30}'
