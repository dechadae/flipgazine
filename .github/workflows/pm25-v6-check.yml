name: PM25 v6 browser check
on:
  push:
    branches: [pm25-v6-check]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null 2>&1 && npm install playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Browser assertions
        run: |
          cat > check.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1});
            const page = await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            const res=await page.goto('https://flipgazine.pages.dev/sindhornmidtown/pm25-v6-stage.html',{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(2500);
            console.log('HTTP',res&&res.status());
            const info=await page.evaluate(()=>{
              const c=document.querySelector('#weatherCanvas');
              const gl=c&&(c.getContext('webgl')||c.getContext('experimental-webgl'));
              const loader=document.querySelector('#sceneLoader');
              const save=document.querySelector('#saveImageBtn');
              const meta=document.querySelector('#weatherMeta');
              return {
                canvas:!!c,gl:!!gl,loaderDone:loader&&loader.classList.contains('is-done'),
                dock:!!document.querySelector('#appDock'),sticky:!!document.querySelector('#stickyLive'),fullscreen:!!document.querySelector('#fullscreenToggle'),
                saveAfterWeather:!!(save&&meta&&(meta.compareDocumentPosition(save)&Node.DOCUMENT_POSITION_FOLLOWING)),
                weatherTemp:document.querySelector('#weatherTemp')?.textContent,
                pm:document.querySelector('#pmValue')?.textContent,aqi:document.querySelector('#aqiValue')?.textContent,
                canvasRect:c&&c.getBoundingClientRect().toJSON(),viewport:[innerWidth,innerHeight],bodyClass:document.body.className
              };
            });
            console.log('INFO',JSON.stringify(info));
            await page.screenshot({path:'pm25-v6.png',fullPage:true});
            if(!res||res.status()!==200) throw new Error('HTTP not 200');
            if(!info.canvas||!info.gl) throw new Error('WebGL missing');
            if(!info.loaderDone) throw new Error('loader did not clear');
            if(!info.dock||!info.sticky||!info.fullscreen) throw new Error('app chrome missing');
            if(!info.saveAfterWeather) throw new Error('save button not at bottom after weather');
            if(info.canvasRect.width<385||info.canvasRect.height<839) throw new Error('canvas not viewport-sized');
            if(errors.length) throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pm25-v6-check
          path: pm25-v6.png
