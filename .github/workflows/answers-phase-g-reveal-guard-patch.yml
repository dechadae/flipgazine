name: Patch Answers Phase G reveal guard call

on:
  push:
    paths:
      - '.github/workflows/answers-phase-g-reveal-guard-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use guarded reveal transaction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/answers-service/index.ts')
          s=p.read_text()
          old='select private.answer_reveal_fast('
          new='select private.answer_reveal_guarded('
          if s.count(old)!=1:
              raise SystemExit(f'expected one reveal call, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/answers-service/index.ts
          git commit -m 'Guard Answers wrong-session reveal'
          git push
