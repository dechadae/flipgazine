name: PM25 browser check

on:
  push:
    branches:
      - pm25-final-check
    paths:
      - ".github/workflows/pm25-browser-check.yml"

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pm25-final-check
          fetch-depth: 1
      - name: Install Playwright
        run: |
          npm --silent init -y >/dev/null 2>&1
          npm --silent install playwright@1.55.0
          npx playwright install chromium
      - name: Run browser verification
        run: |
          cat > pm25-check.cjs <<'JS'
          const { chromium } = require('playwright');
          const URL='https://flipgazine.pages.dev/sindhornmidtown/pm25.html';
          const BLACK='https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/sindhorn-midtown/v1/sindhorn-midtown-vignette-black.png';
          const WHITE='https://sjpvhgxacsiorrtijqua.supabase.co/storage/v1/object/public/media/brand/sindhorn-midtown/v1/sindhorn-midtown-vignette-white.png';
          const AIR='https://stations.airbkk.com/api/web/data';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const report=[];
            try{
              for(const [width,height] of [[320,900],[390,900],[1440,1000]]){
                for(const scheme of ['light','dark']){
                  const context=await browser.newContext({viewport:{width,height},colorScheme:scheme});
                  const page=await context.newPage();
                  const consoleErrors=[]; const pageErrors=[]; const resourceStatus=new Map();
                  page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
                  page.on('pageerror',e=>pageErrors.push(String(e)));
                  page.on('response',r=>{const u=r.url();if(u===BLACK||u===WHITE||u===AIR||u.includes('/brand/vignette/v1/fonts/'))resourceStatus.set(u,r.status())});
                  await page.addInitScript(()=>{
                    window.__paintSamples=[];
                    const start=performance.now();
                    const timer=setInterval(()=>{
                      const root=document.documentElement, body=document.body;
                      if(root)window.__paintSamples.push({t:performance.now()-start,root:getComputedStyle(root).backgroundColor,body:body?getComputedStyle(body).backgroundColor:null,classes:root.className});
                      if(performance.now()-start>2500)clearInterval(timer);
                    },10);
                  });
                  const nav=await page.goto(URL+`?cb=${Date.now()}-${width}-${scheme}`,{waitUntil:'domcontentloaded',timeout:30000});
                  if(!nav||nav.status()!==200)throw new Error(`navigation ${nav&&nav.status()} ${width}/${scheme}`);
                  await page.locator('#report').waitFor({state:'visible',timeout:20000});
                  await page.waitForFunction(()=>document.querySelector('#report')?.getAttribute('aria-busy')==='false',{timeout:20000});
                  await page.waitForTimeout(800);
                  const data=await page.evaluate(()=>{
                    const hotel=[...document.querySelectorAll('.hotel-name')].map(el=>{const r=document.createRange();r.selectNodeContents(el);const rects=[...r.getClientRects()];return{text:el.textContent,lines:[...new Set(rects.map(x=>Math.round(x.top)))]}});
                    const scale=document.querySelector('.scale-labels'),first=scale&&scale.firstElementChild;
                    return{theme:document.documentElement.getAttribute('data-theme'),hotel,scaleColumns:scale?getComputedStyle(scale).gridTemplateColumns:'',scaleFirstDisplay:first?getComputedStyle(first).display:'',scaleFirstColumns:first?getComputedStyle(first).gridTemplateColumns:'',pm:document.querySelector('#pmValue')?.textContent.trim(),aqi:document.querySelector('#aqiValue')?.textContent.trim(),connection:document.querySelector('#connection')?.getAttribute('data-state'),hasManifest:!!document.querySelector('link[rel="manifest"]'),hasHeader:!!document.querySelector('header'),visibleFlipgazine:(document.body?.innerText||'').toLowerCase().includes('flipgazine'),vignetteFont:getComputedStyle(document.querySelector('h1')).fontFamily,thaiFont:getComputedStyle(document.querySelector('h1 [lang="th"]')).fontFamily,vignetteLoaded:document.fonts.check('16px "Vignette Sans"'),thaiLoaded:document.fonts.check('16px "IBM Plex Sans Thai"'),samples:(window.__paintSamples||[]).slice()};
                  });
                  if(data.theme!==scheme)throw new Error(`theme mismatch ${width}/${scheme}: ${data.theme}`);
                  if(data.hotel.length!==2||data.hotel.some(x=>x.text.replace(/\u00a0/g,' ')!=='สินธร มิดทาวน์'||x.lines.length!==1))throw new Error(`hotel wrap ${width}/${scheme}: ${JSON.stringify(data.hotel)}`);
                  if(width<=520){if(data.scaleFirstDisplay!=='grid'||!data.scaleFirstColumns.startsWith('64px '))throw new Error(`mobile scale ${width}/${scheme}: ${data.scaleFirstDisplay}/${data.scaleFirstColumns}`)}else if(data.scaleColumns.trim().split(/\s+/).length!==5)throw new Error(`desktop scale ${data.scaleColumns}`);
                  if(!data.pm||data.pm==='—'||!data.aqi||data.aqi==='—')throw new Error(`missing values ${width}/${scheme}: ${data.pm}/${data.aqi}`);
                  if(!['live','delayed'].includes(data.connection))throw new Error(`online state ${width}/${scheme}: ${data.connection}`);
                  if(data.hasManifest||data.hasHeader||data.visibleFlipgazine)throw new Error(`standalone invariant ${width}/${scheme}: ${JSON.stringify({manifest:data.hasManifest,header:data.hasHeader,flip:data.visibleFlipgazine})}`);
                  if(!data.vignetteLoaded||!data.thaiLoaded)throw new Error(`font load ${width}/${scheme}`);
                  if(data.samples.some(s=>s.root==='rgb(13, 17, 16)'||s.body==='rgb(13, 17, 16)'))throw new Error(`dark shell flash ${width}/${scheme}`);
                  if(consoleErrors.length||pageErrors.length)throw new Error(`console/page errors ${width}/${scheme}: ${JSON.stringify({consoleErrors,pageErrors})}`);
                  for(const u of [BLACK,WHITE])if(resourceStatus.get(u)!==200)throw new Error(`logo not 200 ${resourceStatus.get(u)} ${u}`);
                  if(resourceStatus.get(AIR)!==200)throw new Error(`AirBKK not 200: ${resourceStatus.get(AIR)}`);
                  const fonts=[...resourceStatus].filter(([u])=>u.includes('/brand/vignette/v1/fonts/'));
                  if(fonts.length<2||fonts.some(([,s])=>s!==200))throw new Error(`font response ${JSON.stringify(fonts)}`);
                  if(width===390&&scheme==='light'){
                    await page.click('#themeToggle');await page.waitForTimeout(650);
                    if(await page.getAttribute('html','data-theme')!=='dark')throw new Error('theme toggle failed');
                    await page.reload({waitUntil:'domcontentloaded',timeout:30000});
                    await page.locator('#report').waitFor({state:'visible',timeout:20000});
                    if(await page.getAttribute('html','data-theme')!=='dark')throw new Error('theme persistence failed');
                    await page.waitForFunction(()=>document.querySelector('#report')?.getAttribute('aria-busy')==='false',{timeout:20000});
                    const before=(await page.textContent('#pmValue'))?.trim();
                    await context.setOffline(true);await page.click('#refreshBtn');
                    await page.waitForFunction(()=>document.querySelector('#connection')?.getAttribute('data-state')==='offline',{timeout:15000});
                    const after=(await page.textContent('#pmValue'))?.trim();
                    if(!before||before==='—'||after!==before)throw new Error(`offline fallback ${before}->${after}`);
                    await context.setOffline(false);
                  }
                  report.push({width,scheme,pm:data.pm,aqi:data.aqi,connection:data.connection,scale:data.scaleFirstColumns||data.scaleColumns,fonts:[data.vignetteFont,data.thaiFont],paintSamples:data.samples.length});
                  await context.close();
                }
              }
              console.log('PM25_BROWSER_CHECK_PASS');
              console.log(JSON.stringify(report,null,2));
            }finally{await browser.close()}
          })().catch(e=>{console.error('PM25_BROWSER_CHECK_FAIL',e&&e.stack||e);process.exit(1)});
          JS
          node pm25-check.cjs
          rm -f pm25-check.cjs package.json package-lock.json
          rm -rf node_modules
      - name: Remove one-shot workflow
        if: always()
        run: |
          rm -f pm25-check.cjs package.json package-lock.json
          rm -rf node_modules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pm25-browser-check.yml
          git commit -m "chore: remove PM2.5 browser check" || true
          git push origin HEAD:pm25-final-check || true
