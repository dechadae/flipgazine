# Phase H: canonical router now lives in supabase/functions/_shared.
name: Answers v124 deterministic parity

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/functions/_shared/router-v124.mjs'
      - 'supabase/functions/answers-service/router-v124.mjs'
      - 'supabase/functions/answers-admin-service/router-v124.mjs'
      - 'answers-private-server/router-v124.mjs'
      - 'answers-private-server/parity-v124.mjs'
      - 'answers-private-server/parity-v124-runner.mjs'
      - '.github/workflows/answers-v124-parity.yml'

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deterministic frozen-v124 parity gate
        run: node answers-private-server/parity-v124-runner.mjs
