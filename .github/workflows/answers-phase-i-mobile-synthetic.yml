name: Answers Phase I mobile synthetic

on:
  push:
    paths:
      - '.github/workflows/answers-phase-i-mobile-synthetic.yml'
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          mkdir -p /tmp/phase-i && cd /tmp/phase-i
          npm --silent init -y >/dev/null 2>&1
          npm --silent install playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Exercise live secure Book with deterministic synthetic touch pointers
        shell: bash
        run: |
          cat > /tmp/phase-i/mobile-synthetic.mjs <<'NODE'
          import {chromium} from 'playwright';
          function check(ok,msg){if(!ok)throw new Error(msg)}
          const browser=await chromium.launch({headless:true});
          async function ctx(){return browser.newContext({viewport:{width:412,height:915},deviceScaleFactor:2.625,isMobile:true,hasTouch:true});}
          async function ready(p){
            await p.goto('https://flipgazine.pages.dev/answers-server-lab.html',{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForFunction(()=>document.body?.classList.contains('fg-answers-active')&&document.body?.dataset?.stage==='ask'&&!!document.querySelector('#bookEdge'),null,{timeout:60000});
          }
          async function stage(p,n,timeout=30000){await p.waitForFunction(x=>document.body?.dataset?.stage===x,n,{timeout});}
          async function syntheticOpen(p,fraction){
            await stage(p,'pick');
            await p.evaluate((fraction)=>{
              const el=document.querySelector('#bookEdge');
              if(!el) throw new Error('bookEdge missing');
              const r=el.getBoundingClientRect(),y=r.top+r.height/2;
              const original=el.setPointerCapture;
              el.setPointerCapture=()=>{};
              const fire=(type,x,buttons)=>el.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:41,pointerType:'touch',isPrimary:true,clientX:x,clientY:y,buttons,button:0}));
              fire('pointerdown',r.left+r.width*.2,1);
              fire('pointermove',r.left+r.width*fraction,1);
              fire('pointerup',r.left+r.width*fraction,0);
              el.setPointerCapture=original;
            },fraction);
            await stage(p,'open',30000);
            return {thai:(await p.locator('#thaiAnswer').innerText()).trim(),english:(await p.locator('#englishAnswer').innerText()).trim(),number:(await p.locator('#answerNumber').innerText()).trim()};
          }

          const c1=await ctx(),p1=await c1.newPage();await ready(p1);
          const initial=await p1.evaluate(()=>{const r=document.querySelector('#bookEdge').getBoundingClientRect();return{scrollWidth:document.documentElement.scrollWidth,innerWidth,center:r.x+r.width/2,width:r.width}});
          check(initial.scrollWidth<=initial.innerWidth+1,'horizontal overflow');check(Math.abs(initial.center-206)<12,'closed book center '+initial.center);
          await p1.locator('#question').fill('barista หล่อไหม');await p1.locator('#questionForm button').click();await stage(p1,'pick');
          check(await p1.locator('#questionForm button').isDisabled(),'submit not disabled');
          const normal=await syntheticOpen(p1,.82);check(normal.thai&&normal.english&&normal.number!=='—','normal reveal invalid');
          const opened=await p1.evaluate(()=>{const r=document.querySelector('.open-book').getBoundingClientRect(),t=document.querySelector('#thaiAnswer');return{center:r.x+r.width/2,width:r.width,overflow:document.documentElement.scrollWidth-innerWidth,thaiFit:t.scrollHeight<=t.clientHeight+2&&t.scrollWidth<=t.clientWidth+2}});
          check(Math.abs(opened.center-206)<15,'open book center '+opened.center);check(opened.overflow<=1,'open overflow');check(opened.thaiFit,'Thai answer overflow');check(await p1.locator('#askAgain').isEnabled(),'ask again disabled');
          await p1.locator('#askAgain').click();await stage(p1,'ask');await c1.close();

          const c2=await ctx(),p2=await c2.newPage();await ready(p2);
          await p2.locator('#question').fill('I have chest pain should I take medicine?');await p2.locator('#questionForm button').click();
          const care=await syntheticOpen(p2,.18);check(care.english==='Ask a clinician. This book has no medical license.'&&care.number==='—','CARE mobile drift');await c2.close();

          const c3=await ctx(),p3=await c3.newPage();let intercepted=false;
          await p3.route('**/api/answers/prepare',async route=>{if(!intercepted){intercepted=true;await route.fulfill({status:503,contentType:'application/json',body:'{"error":"service_unavailable"}'});}else await route.continue();});
          await ready(p3);await p3.locator('#question').fill('recovery after one prepare failure');await p3.locator('#questionForm button').click();
          const recovered=await syntheticOpen(p3,.64);check(intercepted&&recovered.thai&&recovered.english,'retry recovery failed');await c3.close();
          await browser.close();
          console.log('PHASE_I_MOBILE_SYNTHETIC='+JSON.stringify({status:'PASS',viewport:[412,915],dpr:2.625,closed_center:initial.center,closed_width:initial.width,open_center:opened.center,open_width:opened.width,no_horizontal_overflow:true,thai_fit:true,normal:true,care:true,recovery_after_prepare_503:true,depths:[.82,.18,.64],pointer_method:'synthetic-touch'}));
          NODE
          node /tmp/phase-i/mobile-synthetic.mjs
