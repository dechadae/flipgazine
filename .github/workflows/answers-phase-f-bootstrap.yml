name: Answers Phase F credential bootstrap

on:
  push:
    paths:
      - '.github/workflows/answers-phase-f-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Create encrypted Pages secret and register only its hash
        shell: bash
        run: |
          set -euo pipefail
          SECRET="$(openssl rand -hex 32)"
          HASH="$(printf '%s' "$SECRET" | sha256sum | awk '{print $1}')"

          printf '%s' "$SECRET" | npx --yes wrangler@latest pages secret put ANSWERS_UPSTREAM_KEY --project-name=flipgazine

          OUT="$(curl --fail --silent --show-error --max-time 60 \
            -X POST \
            -H 'content-type: application/json' \
            -H 'x-fg-bootstrap-cap: Mi3hdN95m7WETPmksP8B8KCB9mqmiuq2me9oZWhNePw' \
            --data "{\"secret_hash\":\"$HASH\"}" \
            'https://sjpvhgxacsiorrtijqua.supabase.co/functions/v1/answers-service-phase-f-bootstrap')"

          node -e 'const x=JSON.parse(process.argv[1]); if(x.status!=="OK") process.exit(1);' "$OUT"
          npx --yes wrangler@latest pages secret list --project-name=flipgazine | grep -q 'ANSWERS_UPSTREAM_KEY'
          echo 'Answers Phase F credential bootstrap: PASS'
