name: Answers Phase H admin authorization smoke

on:
  push:
    paths:
      - '.github/workflows/answers-phase-h-admin-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exercise authenticated private Admin API
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(curl --fail --silent --show-error --max-time 120 'https://sjpvhgxacsiorrtijqua.supabase.co/functions/v1/answers-phase-h-admin-smoke?cap=fg-phase-h-admin-20260817-T7m4Qp9X')"
          printf '%s\n' "$OUT"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.status!=="PASS") process.exit(1)' "$OUT"
