name: Answers Phase I mobile retest

on:
  push:
    paths:
      - '.github/workflows/answers-phase-i-mobile-retest.yml'

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        shell: bash
        run: |
          mkdir -p /tmp/phase-i
          cd /tmp/phase-i
          npm --silent init -y >/dev/null 2>&1
          npm --silent install playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Mobile interaction, theatrical-depth independence and recovery
        shell: bash
        run: |
          cat > /tmp/phase-i/mobile.mjs <<'NODE'
          import {chromium} from 'playwright';
          function check(ok,msg){if(!ok)throw new Error(msg)}
          const browser=await chromium.launch({headless:true});
          async function stage(page,name,timeout=30000){await page.waitForFunction(n=>document.body?.dataset?.stage===n,name,{timeout});}
          async function openAt(page,fraction){
            await stage(page,'pick');
            const b=await page.locator('#bookEdge').boundingBox();check(b&&b.width>100,'book bounds');
            await page.mouse.move(b.x+b.width*.2,b.y+b.height*.5);
            await page.mouse.down();
            await page.mouse.move(b.x+b.width*fraction,b.y+b.height*.5,{steps:8});
            await page.mouse.up();
            await stage(page,'open',20000);
            return {thai:(await page.locator('#thaiAnswer').innerText()).trim(),english:(await page.locator('#englishAnswer').innerText()).trim()};
          }
          async function context(){return browser.newContext({viewport:{width:412,height:915},deviceScaleFactor:2.625,isMobile:true,hasTouch:true});}

          const c1=await context();const p1=await c1.newPage();
          await p1.goto('https://flipgazine.pages.dev/answers-server-lab.html',{waitUntil:'domcontentloaded'});
          await stage(p1,'ask');
          const initial=await p1.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,innerWidth,book:(()=>{const r=document.querySelector('#bookEdge').getBoundingClientRect();return{x:r.x,w:r.width,c:r.x+r.width/2}})()}));
          check(initial.scrollWidth<=initial.innerWidth+1,'horizontal overflow');
          check(Math.abs(initial.book.c-206)<12,'closed book off center: '+initial.book.c);
          await p1.locator('#question').fill('barista หล่อไหม');
          await p1.locator('#questionForm button').click();
          await stage(p1,'pick');
          check(await p1.locator('#questionForm button').isDisabled(),'submit not disabled in pick');
          const a1=await openAt(p1,.82);check(a1.thai&&a1.english,'mobile normal blank');
          const openGeom=await p1.evaluate(()=>{const r=document.querySelector('.open-book').getBoundingClientRect();return{center:r.x+r.width/2,width:r.width,overflow:document.documentElement.scrollWidth-innerWidth}});
          check(Math.abs(openGeom.center-206)<15,'open book off center: '+openGeom.center);
          check(openGeom.overflow<=1,'open stage overflow: '+openGeom.overflow);
          check(await p1.locator('#askAgain').isEnabled(),'ask again disabled');
          await p1.locator('#askAgain').click();await stage(p1,'ask');await c1.close();

          const c2=await context();const p2=await c2.newPage();
          await p2.goto('https://flipgazine.pages.dev/answers-server-lab.html',{waitUntil:'domcontentloaded'});await stage(p2,'ask');
          await p2.locator('#question').fill('I have chest pain should I take medicine?');await p2.locator('#questionForm button').click();
          const care=await openAt(p2,.18);check(care.english==='Ask a clinician. This book has no medical license.','mobile CARE drift');await c2.close();

          const c3=await context();const p3=await c3.newPage();let failed=false;
          await p3.route('**/api/answers/prepare',async route=>{if(!failed){failed=true;await route.fulfill({status:503,contentType:'application/json',body:'{"error":"service_unavailable"}'});}else await route.continue();});
          await p3.goto('https://flipgazine.pages.dev/answers-server-lab.html',{waitUntil:'domcontentloaded'});await stage(p3,'ask');
          await p3.locator('#question').fill('recovery after one prepare failure');await p3.locator('#questionForm button').click();
          const recovered=await openAt(p3,.64);check(failed&&recovered.thai&&recovered.english,'mobile retry failed');await c3.close();
          await browser.close();
          console.log('PHASE_I_MOBILE_RESULT='+JSON.stringify({status:'PASS',viewport:'412x915',dpr:2.625,closed_book_center:initial.book.c,open_book_center:openGeom.center,open_book_width:openGeom.width,normal_answer:true,care_answer:true,first_prepare_intercepted:true,recovery_answer:true,depths_tested:[.82,.18,.64]}));
          NODE
          node /tmp/phase-i/mobile.mjs
