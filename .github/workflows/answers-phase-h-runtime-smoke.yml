name: Answers Phase H revision-aware runtime smoke

on:
  push:
    paths:
      - '.github/workflows/answers-phase-h-runtime-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare reveal replay through Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(mktemp)"; H1="$(mktemp)"; B1="$(mktemp)"; H2="$(mktemp)"; B2="$(mktemp)"; B3="$(mktemp)"
          P="$(curl --silent --show-error --max-time 60 -D "$H1" -c "$JAR" -b "$JAR" -o "$B1" -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"question":"คืนนี้ไปเจอเพื่อนดีไหมนะ"}' \
            'https://flipgazine.pages.dev/api/answers/prepare')"
          test "$P" = '200'
          TOKEN="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(Object.keys(x).sort().join(",")!=="expires_in,request_token"||x.expires_in!==120||x.request_token.length!==43)process.exit(2);process.stdout.write(x.request_token)' "$B1")"
          grep -qi '^cache-control:.*no-store' "$H1"
          R="$(curl --silent --show-error --max-time 60 -D "$H2" -c "$JAR" -b "$JAR" -o "$B2" -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data "{\"request_token\":\"$TOKEN\"}" \
            'https://flipgazine.pages.dev/api/answers/reveal')"
          test "$R" = '200'
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!Number.isInteger(x.id)||!x.thai||!x.english)process.exit(2)' "$B2"
          grep -qi '^cache-control:.*no-store' "$H2"
          RR="$(curl --silent --show-error --max-time 60 -c "$JAR" -b "$JAR" -o "$B3" -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data "{\"request_token\":\"$TOKEN\"}" \
            'https://flipgazine.pages.dev/api/answers/reveal')"
          test "$RR" = '404'
          SID="$(awk '$6=="fg_ans_sid"{print $7}' "$JAR" | tail -1)"
          test -n "$SID"
          SESSION_HASH="$(printf '%s' "$SID" | sha256sum | awk '{print $1}')"
          printf 'PHASE_H_RUNTIME_RESULT={"status":"PASS","prepare":%s,"reveal":%s,"replay":%s,"session_hash":"%s"}\n' "$P" "$R" "$RR" "$SESSION_HASH"
          rm -f "$JAR" "$H1" "$B1" "$H2" "$B2" "$B3"
