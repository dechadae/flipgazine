name: Answers Phase H final parity proof

on:
  push:
    paths:
      - '.github/workflows/answers-phase-h-parity-proof.yml'

permissions:
  contents: write

jobs:
  parity-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run frozen-v124 parity and record exact result
        shell: bash
        run: |
          set -euo pipefail
          node answers-private-server/parity-v124-runner.mjs | tee /tmp/parity.log
          LINE="$(grep '^PHASE_D_PARITY_RESULT=' /tmp/parity.log | tail -1)"
          test -n "$LINE"
          JSON="${LINE#PHASE_D_PARITY_RESULT=}"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.status!=="PASS"||x.routeCases!==64626||x.routeDifferences!==0||x.generatedQuestions!==5386||x.careCases!==6||x.normalChooseAnswerCases!==15||x.finalFallbackCases!==4||!x.invariants?.exactlyTwoUniversalOnMatchedNonGeneric||!x.invariants?.uniformProbabilityOneOverEligible) process.exit(2)' "$JSON"
          printf '%s\n' "$JSON" > answers-private-server/phase-h-parity-proof.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add answers-private-server/phase-h-parity-proof.json
          git commit -m 'Record Phase H final Answers parity proof'
          git push
